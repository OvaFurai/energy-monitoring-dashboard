<!DOCTYPE html>
<html>
<head>
    <title>History</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            margin:30px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:8px;
            text-align:center;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        .btn{
            display:inline-block;
            padding:10px 16px;
            background:#3498db;
            color:white;
            text-decoration:none;
            border-radius:5px;
            margin-bottom:20px;
        }
    </style>

</head>

<body>

<h1>History Data</h1>

<a href="/download" class="btn">
Download CSV
</a>

<table>

<thead>

<tr>
<th>Date & Time</th>
<th>Voltage</th>
<th>Current</th>
<th>Power</th>
<th>Energy</th>
<th>Frequency</th>
<th>PF</th>
</tr>

</thead>

<tbody id="historyBody">
</tbody>

</table>

<script>

fetch("/history/data")
.then(r=>r.json())
.then(data=>{

    let html="";

    data.forEach(row=>{

        html+=`
        <tr>
            <td>${row.timestamp}</td>
            <td>${row.voltage}</td>
            <td>${row.current}</td>
            <td>${row.power}</td>
            <td>${row.energy}</td>
            <td>${row.frequency}</td>
            <td>${row.pf}</td>
        </tr>
        `;

    });

    document.getElementById("historyBody").innerHTML=html;

});

</script>

</body>
</html>
